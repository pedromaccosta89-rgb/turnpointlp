<!doctype html>
<html lang="pt-PT">
<head>

  <meta charset="utf-8">
  <title>Obrigado pelo contacto | PointLevel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      
      color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
 .gradient-hero {
      background: linear-gradient(135deg, #021b23 0%, #7dc1a3 100%);
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .container {
      max-width: 620px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 1.25rem;
    }

    .highlight {
      font-weight: 700;
    }

    .cta {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
    }

    .whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--brand-accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 32px rgba(0,0,0,0.3);
    }

    .whatsapp svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .note {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Onda branca */
    .wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      line-height: 0;
      z-index: 1;
    }

    .wave svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body class="bg-white overflow-x-hidden">

<section class="gradient-hero min-h-screen flex items-center relative overflow-hidden">

  <!-- CONTEÚDO (1 coluna, centrado) -->
  <div class="relative z-10 max-w-xl mx-auto px-6 text-white text-center">
    
    <h1 class="text-3xl sm:text-4xl font-extrabold mb-4">
      Obrigado pelo seu contacto
    </h1>

    <p class="text-base sm:text-lg opacity-90 mb-4">
      A sua mensagem foi recebida com sucesso.
      Vou analisá-la pessoalmente e responder-lhe em até
      <strong>24 horas úteis</strong>.
    </p>

    <p class="opacity-80 mb-8">
      Se preferir avançar já, pode falar comigo diretamente pelo WhatsApp.
    </p>

    <a href="https://wa.me/351966285373"
       target="_blank"
       class="inline-flex items-center gap-2 bg-[#25d366] hover:bg-[#1ebe5d] text-white font-bold px-6 py-3 rounded-full shadow-lg transition">
      Falar no WhatsApp
    </a>

    <p class="mt-6 text-sm opacity-60">
      Não é necessário reenviar o formulário.
    </p>

  </div>

  <!-- ONDA (igual à landing) -->
  <div class="absolute bottom-[-1px] left-0 right-0 pointer-events-none">
    <svg viewBox="0 0 1440 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M0 120L60 105C120 90 240 60 360 45C480 30 600 30 720 37.5C840 45 960 60 1080 67.5C1200 75 1320 75 1380 75L1440 75V120H0Z"
        fill="white"
      />
    </svg>
  </div>

</section>

</body>
</html>
